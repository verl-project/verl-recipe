defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: poise
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false

critic:
  enable: false

data:
  train_files: ???
  val_files: ???
  train_batch_size: 256
  max_prompt_length: 4096
  max_response_length: 8192
  filter_overlong_prompts: true
  truncation: error
  seed: 42

actor_rollout_ref:
  model:
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 10
      lr_scheduler_type: constant
      weight_decay: 0.01
    ppo_mini_batch_size: 32
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 24576
    use_kl_loss: false
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    grad_clip: 1.0
    loss_agg_mode: token-mean
    fsdp_config:
      seed: 42
      ulysses_sequence_parallel_size: 1
  rollout:
    name: vllm
    mode: async
    n: 2
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    seed: 42
    tensor_model_parallel_size: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 24576
    max_model_len: 12288
    max_num_batched_tokens: 24576
    max_num_seqs: 128
    enable_chunked_prefill: true
    multi_turn:
      enable: false
    val_kwargs:
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      n: 4

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  project_name: poise
  logger: [console, wandb]
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 10
  total_training_steps: 200
  save_freq: 20
  test_freq: 20
  resume_mode: auto
  default_local_dir: checkpoints/poise/${trainer.experiment_name}

poise:
  bootstrap_steps: 16
  warmup_steps: 8
  layer: 19
  pool_tokens: 10
  prompt_pca_dim: 32
  response_pca_dim: 64
  ridge_alpha: 100.0
  seed: 42
  buffer_rows:
    math: 4096
    code: 3072
    other: 3072
