nemo_gym:
  nemo_gym_root: $NEMO_GYM_ROOT
  uses_reasoning_parser: false
  config_paths:
    - $NEMO_GYM_ROOT/responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    # Requires NVIDIA-NeMo/Gym#1865 (interactive_browser resources server).
    # Swap for providers/lexmount/configs/lexmount.yaml to drive remote browsers.
    - $NEMO_GYM_ROOT/resources_servers/interactive_browser/configs/interactive_browser.yaml
