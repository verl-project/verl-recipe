tools:
  - class_name: verl.tools.base_tool.BaseTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: bash
        description: Execute a bash command in the terminal.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: The bash command to execute
            timeout:
              type: integer
              description: Timeout in seconds (default 30)
          required:
            - command

  - class_name: verl.tools.base_tool.BaseTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: done
        description: Mark the task as complete. Call this when you have verified the task is solved.
        parameters:
          type: object
          properties: {}
