name: Dynamo CPU contracts

on:
  pull_request:
    paths:
      - "dynamo/**"
      - ".github/workflows/dynamo-cpu-tests.yml"
  push:
    branches:
      - main
    paths:
      - "dynamo/**"
      - ".github/workflows/dynamo-cpu-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Check launcher and program-scope contracts
        # The launcher test records child arguments; it does not start a trainer.
        run: >-
          .venv/bin/python -m pytest -q
          dynamo/tests/test_smoke_entrypoint.py
          dynamo/tests/test_thunderagent.py
