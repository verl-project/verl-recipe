# Qwen3-1.7B actor + colocated vLLM rollout with server-side LoRA.
#
# The base model remains frozen. Tinker scalar prompt-logprob requests for the
# initial model are evaluated with the adapter disabled, while normal rollout
# requests use the latest synchronized adapter weights.

server:
  model_name: ${oc.env:TINKER_SERVER_MODEL_NAME,Qwen/Qwen3-1.7B}
  host: ${oc.env:TINKER_SERVER_HOST,0.0.0.0}
  port: ${oc.env:TINKER_SERVER_PORT,8000}
  ray_address: ${oc.env:RAY_ADDRESS,local}
  checkpoint_dir: ${oc.env:TINKER_CHECKPOINT_DIR,/tmp/tinker-checkpoints}
  server_max_runtime: ${oc.env:TINKER_SERVER_MAX_RUNTIME,null}
  max_concurrent_samples: ${oc.env:TINKER_SERVER_MAX_CONCURRENT_SAMPLES,32}
  enable_offload: true
  auto_merge_verl_default_config: true

actor_rollout_ref:
  actor:
    strategy: veomni
    use_kl_loss: false
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    veomni:
      cross_entropy_loss_implementation: chunk_loss
      param_offload: false
      optimizer_offload: false
    optim:
      lr_scheduler_type: constant
      lr: 2.0e-5
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    max_num_seqs: 128
    max_num_batched_tokens: 4096
    enable_chunked_prefill: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    free_cache_engine: true
    enforce_eager: false
  ref:
    enable: false
  model:
    path: ${oc.env:TINKER_SERVER_MODEL_PATH,Qwen/Qwen3-1.7B}
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true
    # VeRL's FSDP/VeOmni LoRA configuration.
    lora_rank: 32
    lora_alpha: 32
    target_modules: all-linear
    lora_adapter_path: null

algorithm:
  adv_estimator: sft
  use_kl_in_reward: false

data:
  train_batch_size: 64
  max_prompt_length: 4096
  max_response_length: 4096

trainer:
  logger:
  - console
  project_name: verl_tinker_server
  experiment_name: qwen3_1b7_actor_rollout_lora
  nnodes: 1
  n_gpus_per_node: ${oc.env:TINKER_SERVER_N_GPUS_PER_NODE,8}
